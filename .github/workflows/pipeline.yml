name: Automated Image and Video Pipeline

on:
  workflow_dispatch:

jobs:
  prepare-prompts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install deep-translator
        python auto_prompt.py
    - uses: actions/upload-artifact@v4
      with:
        name: text-prompts
        path: prompts.txt
    - id: set-matrix
      run: |
        count=$(wc -l < prompts.txt)
        matrix_json=$(python3 -c "import json; print(json.dumps(list(range(1, int($count) + 1))))")
        echo "matrix=$matrix_json" >> $GITHUB_OUTPUT

  generate-images:
    needs: prepare-prompts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5  # इमेज के लिए 5 मशीनें
      matrix:
        machine_id: ${{ fromJson(needs.prepare-prompts.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium
    - uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - name: Run Image Generator with Auto-Retry
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      # 🔄 ऑटो-एरर हैंडलिंग (3 बार ट्राई करेगा)
      run: |
        for i in 1 2 3; do python main.py ${{ matrix.machine_id }} && break || sleep 10; done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bing_image_${{ matrix.machine_id }}
        path: bing_automated_images/

  generate-videos:
    needs: [prepare-prompts, generate-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2  # ⚠️ वीडियो के लिए सिर्फ़ 2 मशीनें
      matrix:
        machine_id: ${{ fromJson(needs.prepare-prompts.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt Pillow
        playwright install chromium
        playwright install-deps chromium
    - uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: bing_image_${{ matrix.machine_id }}
        path: bing_automated_images/
    - name: Run Video Generator with Auto-Retry
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      # 🔄 वीडियो में भी 3 बार ट्राई करेगा
      run: |
        for i in 1 2 3; do python generate_video.py ${{ matrix.machine_id }} && break || sleep 15; done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: video_machine_${{ matrix.machine_id }}
        path: generated_videos/

  post-process-and-zip:
    needs: generate-videos
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        pip install edge-tts deep-translator Pillow
    - uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - uses: actions/download-artifact@v4
      with:
        path: all_downloaded_videos/
        pattern: video_machine_*
        merge-multiple: true
    - run: python process_videos.py
    - run: cd final_output && zip -r ../final_polished_videos.zip .
    - uses: actions/upload-artifact@v4
      with:
        name: Polished_Videos_ZIP
        path: final_polished_videos.zip
