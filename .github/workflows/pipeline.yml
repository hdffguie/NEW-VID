name: Automated AI Vertical Video Pipeline

on:
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium
        
    - name: Run Bing Image Generator (9:16)
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py --machine_id 1 --total_machines 1

    - name: Save Images Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ai_generated_images
        path: ai_generated_images/

    - id: set-matrix
      run: |
        cd ai_generated_images
        count=$(ls Generated_Image_*.jpg 2>/dev/null | wc -l)
        echo "Total Images Generated: $count"
        matrix_json=$(python3 -c "import json; print(json.dumps(list(range(1, $count + 1))))")
        echo "matrix=$matrix_json" >> $GITHUB_OUTPUT

  generate-videos-and-edit:
    needs: generate-images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Download Images Artifact
      uses: actions/download-artifact@v4
      with:
        name: ai_generated_images
        path: ai_generated_images/

    - run: |
        pip install -r requirements.txt
        sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
        # ImageMagick policy fix for MoviePy TextClips
        sudo sed -i 's/pattern="PDF"/pattern="NONE"/' /etc/ImageMagick-6/policy.xml || true

    - name: Run Voiceover, Captions & Video Assembler
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_video.py

    - name: Save Final Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final_Vertical_Masterpiece
        path: Final_Long_Educational_Video.mp4
