name: Automated Image to AI Video Pipeline (9:16)

on:
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium
        
    - name: Run Bing Image Generator (9:16)
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py --machine_id 1 --total_machines 1

    - name: Save Images Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ai_generated_images
        path: ai_generated_images/

    - id: set-matrix
      run: |
        cd ai_generated_images
        count=$(ls Generated_Image_*.jpg 2>/dev/null | wc -l)
        echo "Total Images Generated: $count"
        matrix_json=$(python3 -c "import json; print(json.dumps(list(range(1, $count + 1))))")
        echo "matrix=$matrix_json" >> $GITHUB_OUTPUT

  generate-videos-and-edit:
    needs: generate-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        machine_id: ${{ fromJson(needs.generate-images.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Download Images Artifact
      uses: actions/download-artifact@v4
      with:
        name: ai_generated_images
        path: ai_generated_images/

    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium
        sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
        sudo sed -i 's/pattern="PDF"/pattern="NONE"/' /etc/ImageMagick-6/policy.xml || true

    - name: Run Upsampler Video Generator & Voice Editor
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_video.py ${{ matrix.machine_id }}

    - name: Save Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: video_machine_${{ matrix.machine_id }}
        path: generated_videos/

  post-process-and-combine:
    needs: generate-videos-and-edit
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    
    - name: Install FFmpeg & ImageMagick
      run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

    - name: Download All Video Artifacts
      uses: actions/download-artifact@v4
      with:
        path: all_downloaded_videos/

    - name: Run Final Masterpiece Assembler
      run: python process_videos.py

    - name: Upload Final Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final_Long_Story_Video
        path: Final_Long_Educational_Video.mp4
