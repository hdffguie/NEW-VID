name: Automated Image and Video Pipeline

on:
  schedule:
    - cron: '57 23 * * *'
    - cron: '56 14 * * *'
  workflow_dispatch:
    inputs:
      video_duration:
        description: 'Video Length in Seconds (e.g. 15, 30, 60)'
        required: true
        default: '60'
        type: string
      visual_style:
        description: 'Visual Style (Image Type)'
        required: true
        default: 'Realistic Human'
        type: choice
        options:
        - 'Realistic Human'
        - '3D Pixar'
        - '2D Anime'
      story_genre:
        description: 'Story Genre (Tone)'
        required: true
        default: 'Educational'
        type: choice
        options:
        - 'Educational'
        - 'Funny'
        - 'Cartoon'
        - 'Sad'
        - 'Horror'

permissions:
  contents: write

jobs:
  prepare-prompts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install google-genai
        python auto_prompt.py
      env:
        VIDEO_DURATION: ${{ github.event.inputs.video_duration || '60' }}
        VISUAL_STYLE: ${{ github.event.inputs.visual_style || 'Realistic Human' }}
        STORY_GENRE: ${{ github.event.inputs.story_genre || 'Educational' }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    - name: Commit and Push Updated story.txt
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add story.txt
        git commit -m "Auto-removed processed story" || echo "No changes to commit"
        git push
    - uses: actions/upload-artifact@v4
      with:
        name: text-prompts
        path: |
          prompts.txt
          metadata.txt
    - id: set-matrix
      run: |
        count=$(grep -c '^' prompts.txt || echo 0)
        if [ "$count" -eq 0 ]; then exit 1; fi
        matrix_json=$(python3 -c "import json; print(json.dumps(list(range(1, $count + 1))))")
        echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  generate-images:
    needs: prepare-prompts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        machine_id: ${{ fromJson(needs.prepare-prompts.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium
    - uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - name: Run Image Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py ${{ matrix.machine_id }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bing_image_${{ matrix.machine_id }}
        path: bing_automated_images/

  generate-videos:
    needs: [prepare-prompts, generate-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        machine_id: ${{ fromJson(needs.prepare-prompts.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install FFmpeg
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        pip install -r requirements.txt Pillow
        playwright install chromium
        playwright install-deps chromium
    - uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: bing_image_${{ matrix.machine_id }}
        path: bing_automated_images/
    - name: Run Video Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_video.py ${{ matrix.machine_id }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: video_machine_${{ matrix.machine_id }}
        path: generated_videos/

  post-process-and-upload:
    needs: generate-videos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install FFmpeg, Fonts and Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg wget
        wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/hind/Hind-Bold.ttf" -O NotoSansHindi.ttf
        pip install -r requirements.txt
    - uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - uses: actions/download-artifact@v4
      with:
        path: all_downloaded_videos/
        pattern: video_machine_*
        merge-multiple: true
    - name: Process Video Filters & Audio
      run: python process_videos.py
    - name: Auto Upload to YouTube
      env:
        YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
      run: python upload_youtube.py
    - run: |
        cp metadata.txt final_output/
        cd final_output && zip -r ../final_polished_videos.zip .
    - uses: actions/upload-artifact@v4
      with:
        name: Polished_Videos_ZIP
        path: final_polished_videos.zip
