name: Automated Image and Video Pipeline

on:
  workflow_dispatch:

jobs:
  # 1. सबसे पहले कहानी पढ़ेगा और तय करेगा कि कितनी मशीनें चलानी हैं
  prepare-prompts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Run Auto Prompt Generator
      run: |
        pip install deep-translator
        python auto_prompt.py
    - name: Save Prompts Artifact
      uses: actions/upload-artifact@v4
      with:
        name: text-prompts
        path: prompts.txt
    - id: set-matrix
      run: |
        count=$(wc -l < prompts.txt)
        echo "Total Prompts/Machines: $count"
        matrix_json=$(python3 -c "import json; print(json.dumps(list(range(1, int($count) + 1))))")
        echo "matrix=$matrix_json" >> $GITHUB_OUTPUT

  # 2. जितनी कहानी की लाइनें, उतनी इमेज की मशीनें (max 5 at a time)
  generate-images:
    needs: prepare-prompts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        machine_id: ${{ fromJson(needs.prepare-prompts.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium
    - name: Download Prompts
      uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - name: Run Bing Image Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py ${{ matrix.machine_id }}
    - name: Save Individual Image Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bing_image_${{ matrix.machine_id }}
        path: bing_automated_images/

  # 3. इमेज के बाद वीडियो वाली मशीनें
  generate-videos:
    needs: [prepare-prompts, generate-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        machine_id: ${{ fromJson(needs.prepare-prompts.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt Pillow
        playwright install chromium
        playwright install-deps chromium
    - name: Download Prompts
      uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - name: Download Corresponding Image
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: bing_image_${{ matrix.machine_id }}
        path: bing_automated_images/
    - name: Run Upsampler Video Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_video.py ${{ matrix.machine_id }}
    - name: Save Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: video_machine_${{ matrix.machine_id }}
        path: generated_videos/

  # 4. फाइनल एडिटिंग, आवाज़ और BGM
  post-process-and-zip:
    needs: generate-videos
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install FFmpeg and Tools
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        pip install edge-tts deep-translator Pillow
    - name: Download Prompts
      uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - name: Download All Videos
      uses: actions/download-artifact@v4
      with:
        path: all_downloaded_videos/
        pattern: video_machine_*
        merge-multiple: true
    - name: Run Video Polishing Script
      run: python process_videos.py
    - name: Create Final ZIP Package
      run: |
        cd final_output
        zip -r ../final_polished_videos.zip .
    - name: Upload Polished ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Polished_Videos_ZIP
        path: final_polished_videos.zip
