name: Automated Video Pipeline (Text-to-Video)

on:
  schedule:
    - cron: '0 21 * * *'  
    - cron: '0 22 * * *'  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-prompts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install google-genai
        python auto_prompt.py
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    - run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add story.txt
        git commit -m "Auto-removed processed story" || echo "No changes to commit"
        git push
    - uses: actions/upload-artifact@v4
      with:
        name: text-prompts
        path: |
          prompts.txt
          metadata.txt
    - id: set-matrix
      run: |
        count=$(grep -c '^' prompts.txt || echo 0)
        if [ "$count" -eq 0 ]; then exit 1; fi
        matrix_json=$(python3 -c "import json; print(json.dumps(list(range(1, $count + 1))))")
        echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  generate-videos:
    needs: prepare-prompts  # 🚨 अब यह सीधा prepare-prompts के बाद चलेगा
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        machine_id: ${{ fromJson(needs.prepare-prompts.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 🌐 Auto-Install & Connect VPN
      continue-on-error: true
      run: |
        sudo apt-get update -qq && sudo apt-get install -y openvpn curl -qq
        for i in {1..3}; do
          curl -s --max-time 15 https://www.vpngate.net/api/iphone/ > vpn_data.csv
          if grep -q "^HostName" vpn_data.csv; then
            BASE64_DATA=$(grep -v "^#" vpn_data.csv | grep -v "^HostName" | shuf -n 1 | awk -F "," '{print $15}' | tr -d '\r')
            if [ -n "$BASE64_DATA" ]; then
              echo "$BASE64_DATA" | base64 -d > auto_vpn.ovpn 2>/dev/null
              if [ -s auto_vpn.ovpn ]; then break; fi
            fi
          fi
          sleep 2
        done
        if [ -s auto_vpn.ovpn ]; then sudo openvpn --config auto_vpn.ovpn --daemon; sleep 15; fi
        
    - name: Install Dependencies
      run: |
        sudo apt-get install -y ffmpeg
        pip install -r requirements.txt Pillow requests
        playwright install chromium
        playwright install-deps chromium
    - uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - name: Run Video Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_video.py ${{ matrix.machine_id }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: video_machine_${{ matrix.machine_id }}
        path: generated_videos/

  post-process-and-upload:
    needs: generate-videos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install FFmpeg & Download Private Clip
      env:
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        GDRIVE_JSON: ${{ secrets.GDRIVE_JSON }}
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg wget
        wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/hind/Hind-Bold.ttf" -O NotoSansHindi.ttf
        pip install -r requirements.txt google-api-python-client google-auth-httplib2 google-auth-oauthlib
        python download_clip.py
        
    - uses: actions/download-artifact@v4
      with:
        name: text-prompts
    - uses: actions/download-artifact@v4
      with:
        path: all_downloaded_videos/
        pattern: video_machine_*
        merge-multiple: true
        
    - name: Process Video Filters & Audio
      run: python process_videos.py
      
    - name: Auto Upload to YouTube
      env:
        YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
      run: python upload_youtube.py
